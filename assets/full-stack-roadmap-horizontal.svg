<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="960" viewBox="0 0 1600 960" role="img" aria-labelledby="title desc">
  <title id="title">Full Stack Learning Roadmap</title>
  <desc id="desc">An eleven-step visual learning path from development foundations to portfolio.</desc>
  <style>
    .title { font: 700 38px sans-serif; fill: #16263d; }
    .subtitle { font: 400 18px sans-serif; fill: #526477; }
    .number { font: 700 18px sans-serif; fill: #ffffff; }
    .step { font: 700 18px sans-serif; fill: #16263d; }
    .duration { font: 400 15px sans-serif; fill: #526477; }
    .label { font: 700 14px sans-serif; fill: #ffffff; }
    .connector { stroke: #9aabbc; stroke-width: 3; fill: none; }
  </style>
  <rect width="1600" height="960" fill="#f7fafc"/>
  <path d="M0 0H1600V130C1320 190 1110 80 800 145C480 210 260 125 0 190Z" fill="#d9f3ed"/>
  <text x="90" y="82" class="title">Full Stack Learning Roadmap</text>
  <text x="90" y="112" class="subtitle">11 етапів від основ вебу до сильного портфоліо</text>

  <path d="M230 270H305M505 270H580M780 270H855M1055 270H1130M1330 270V405H230V505H305M505 505H580M780 505H855M1055 505H1130M1330 505V640H230V740H305M505 740H580" class="connector"/>

  <g transform="translate(80 210)">
    <rect width="150" height="120" rx="8" fill="#ffffff" stroke="#c9d6e2"/>
    <circle cx="28" cy="28" r="18" fill="#0f766e"/><text x="28" y="34" text-anchor="middle" class="number">1</text>
    <text x="20" y="75" class="step">Основи</text><text x="20" y="98" class="duration">2-3 тижні</text>
  </g>
  <g transform="translate(355 210)">
    <rect width="150" height="120" rx="8" fill="#ffffff" stroke="#c9d6e2"/>
    <circle cx="28" cy="28" r="18" fill="#ea580c"/><text x="28" y="34" text-anchor="middle" class="number">2</text>
    <text x="20" y="75" class="step">HTML + CSS</text><text x="20" y="98" class="duration">4-6 тижнів</text>
  </g>
  <g transform="translate(630 210)">
    <rect width="150" height="120" rx="8" fill="#ffffff" stroke="#c9d6e2"/>
    <circle cx="28" cy="28" r="18" fill="#eab308"/><text x="28" y="34" text-anchor="middle" class="number">3</text>
    <text x="20" y="75" class="step">JavaScript</text><text x="20" y="98" class="duration">8-10 тижнів</text>
  </g>
  <g transform="translate(905 210)">
    <rect width="150" height="120" rx="8" fill="#ffffff" stroke="#c9d6e2"/>
    <circle cx="28" cy="28" r="18" fill="#2563eb"/><text x="28" y="34" text-anchor="middle" class="number">4</text>
    <text x="20" y="75" class="step">TypeScript</text><text x="20" y="98" class="duration">2-3 тижні</text>
  </g>
  <g transform="translate(1180 210)">
    <rect width="150" height="120" rx="8" fill="#ffffff" stroke="#c9d6e2"/>
    <circle cx="28" cy="28" r="18" fill="#db2777"/><text x="28" y="34" text-anchor="middle" class="number">5</text>
    <text x="20" y="75" class="step">React</text><text x="20" y="98" class="duration">6-8 тижнів</text>
  </g>
  <g transform="translate(80 445)">
    <rect width="150" height="120" rx="8" fill="#ffffff" stroke="#c9d6e2"/>
    <circle cx="28" cy="28" r="18" fill="#16a34a"/><text x="28" y="34" text-anchor="middle" class="number">6</text>
    <text x="20" y="75" class="step">Node.js</text><text x="20" y="98" class="duration">6-8 тижнів</text>
  </g>
  <g transform="translate(355 445)">
