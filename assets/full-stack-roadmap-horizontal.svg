    <circle cx="28" cy="28" r="18" fill="#0891b2"/><text x="28" y="34" text-anchor="middle" class="number">7</text>
    <text x="20" y="75" class="step">Бази даних</text><text x="20" y="98" class="duration">4-5 тижнів</text>
  </g>
  <g transform="translate(630 445)">
    <rect width="150" height="120" rx="8" fill="#ffffff" stroke="#c9d6e2"/>
    <circle cx="28" cy="28" r="18" fill="#dc2626"/><text x="28" y="34" text-anchor="middle" class="number">8</text>
    <text x="20" y="75" class="step">Безпека</text><text x="20" y="98" class="duration">3-4 тижні</text>
  </g>
  <g transform="translate(905 445)">
    <rect width="150" height="120" rx="8" fill="#ffffff" stroke="#c9d6e2"/>
    <circle cx="28" cy="28" r="18" fill="#7c3aed"/><text x="28" y="34" text-anchor="middle" class="number">9</text>
    <text x="20" y="75" class="step">Тестування</text><text x="20" y="98" class="duration">3-4 тижні</text>
  </g>
  <g transform="translate(1180 445)">
    <rect width="150" height="120" rx="8" fill="#ffffff" stroke="#c9d6e2"/>
    <circle cx="28" cy="28" r="18" fill="#475569"/><text x="28" y="34" text-anchor="middle" class="number">10</text>
    <text x="20" y="75" class="step">DevOps</text><text x="20" y="98" class="duration">2-3 тижні</text>
  </g>
  <g transform="translate(355 680)">
    <rect width="425" height="120" rx="8" fill="#16263d"/>
    <circle cx="32" cy="30" r="18" fill="#f59e0b"/><text x="32" y="36" text-anchor="middle" class="number">11</text>
    <text x="28" y="76" class="label">Портфоліо</text><text x="28" y="100" class="label">4-8 тижнів · 2-3 готові проєкти</text>
