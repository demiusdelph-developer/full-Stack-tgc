  <a href="../02-html-css/" target="_top"><g transform="translate(65 305)"><circle cx="50" cy="50" r="31" fill="#ea580c"/><text x="50" y="57" text-anchor="middle" class="number">2</text><rect x="100" width="625" height="100" rx="8" fill="#fff" stroke="#c9d6e2"/><text x="130" y="41" class="step">HTML, CSS та Sass</text><text x="130" y="70" class="detail">Flexbox, Grid, адаптивність · 4-6 тижнів</text></g></a>
  <a href="../04-javascript/" target="_top"><g transform="translate(65 420)"><circle cx="50" cy="50" r="31" fill="#eab308"/><text x="50" y="57" text-anchor="middle" class="number">3</text><rect x="100" width="625" height="100" rx="8" fill="#fff" stroke="#c9d6e2"/><text x="130" y="41" class="step">JavaScript</text><text x="130" y="70" class="detail">DOM, async/await, API, модулі · 8-10 тижнів</text></g></a>
  <a href="../05-typescript/" target="_top"><g transform="translate(65 535)"><circle cx="50" cy="50" r="31" fill="#2563eb"/><text x="50" y="57" text-anchor="middle" class="number">4</text><rect x="100" width="625" height="100" rx="8" fill="#fff" stroke="#c9d6e2"/><text x="130" y="41" class="step">TypeScript</text><text x="130" y="70" class="detail">Типи, interfaces, generics · 2-3 тижні</text></g></a>
  <a href="../07-react-frontend/" target="_top"><g transform="translate(65 650)"><circle cx="50" cy="50" r="31" fill="#db2777"/><text x="50" y="57" text-anchor="middle" class="number">5</text><rect x="100" width="625" height="100" rx="8" fill="#fff" stroke="#c9d6e2"/><text x="130" y="41" class="step">React frontend</text><text x="130" y="70" class="detail">Компоненти, hooks, routing, запити · 6-8 тижнів</text></g></a>
  <a href="../08-nodejs-backend/" target="_top"><g transform="translate(65 765)"><circle cx="50" cy="50" r="31" fill="#16a34a"/><text x="50" y="57" text-anchor="middle" class="number">6</text><rect x="100" width="625" height="100" rx="8" fill="#fff" stroke="#c9d6e2"/><text x="130" y="41" class="step">Node.js та backend</text><text x="130" y="70" class="detail">REST API, middleware, validation · 6-8 тижнів</text></g></a>
  <a href="../09-databases/" target="_top"><g transform="translate(65 880)"><circle cx="50" cy="50" r="31" fill="#0891b2"/><text x="50" y="57" text-anchor="middle" class="number">7</text><rect x="100" width="625" height="100" rx="8" fill="#fff" stroke="#c9d6e2"/><text x="130" y="41" class="step">Бази даних</text><text x="130" y="70" class="detail">SQL, PostgreSQL, ORM, migrations · 4-5 тижнів</text></g></a>
  <a href="../10-authentication-security/" target="_top"><g transform="translate(65 995)"><circle cx="50" cy="50" r="31" fill="#dc2626"/><text x="50" y="57" text-anchor="middle" class="number">8</text><rect x="100" width="625" height="100" rx="8" fill="#fff" stroke="#c9d6e2"/><text x="130" y="41" class="step">Авторизація та безпека</text><text x="130" y="70" class="detail">JWT, cookies, roles, CORS · 3-4 тижні</text></g></a>
  <a href="../11-testing/" target="_top"><g transform="translate(65 1110)"><circle cx="50" cy="50" r="31" fill="#7c3aed"/><text x="50" y="57" text-anchor="middle" class="number">9</text><rect x="100" width="625" height="100" rx="8" fill="#fff" stroke="#c9d6e2"/><text x="130" y="41" class="step">Тестування</text><text x="130" y="70" class="detail">Unit, API, UI та E2E тести · 3-4 тижні</text></g></a>
  <a href="../12-deployment-devops/" target="_top"><g transform="translate(65 1225)"><circle cx="50" cy="50" r="31" fill="#475569"/><text x="50" y="57" text-anchor="middle" class="number">10</text><rect x="100" width="625" height="100" rx="8" fill="#fff" stroke="#c9d6e2"/><text x="130" y="41" class="step">Деплой і DevOps</text><text x="130" y="70" class="detail">Docker, CI/CD, хмарний деплой · 2-3 тижні</text></g></a>
  <a href="../13-portfolio/" target="_top"><g transform="translate(65 1340)"><circle cx="50" cy="50" r="31" fill="#f59e0b"/><text x="50" y="57" text-anchor="middle" class="number">11</text><rect class="final-card" x="100" width="625" height="100" rx="8" fill="#16263d"/><text x="130" y="41" class="step-light">Портфоліо</text><text x="130" y="70" class="detail-light">2-3 якісні проєкти · 4-8 тижнів</text></g></a>
